[package]
name = "cauli-worker"
version = "0.1.0"
edition = "2021"
description = "Rust worker runtime for cauli Python task queues"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bilalwork31-cyber/Cauli"
homepage = "https://github.com/bilalwork31-cyber/Cauli"
keywords = ["task-queue", "background-jobs", "redis", "worker", "celery"]
categories = ["asynchronous", "concurrency"]

[features]
default = []
# Enables the CAULI_EXEC_CMD test hook in src/cpu.rs (audit M5). Not part of a
# normal release build; the e2e suite needs `cargo test --features test-hooks`.
test-hooks = []

[[bin]]
name = "cauli-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
gethostname = "1"
libc = "0.2"
pyo3 = { version = "0.26", features = ["auto-initialize"] }
rand = "0.9"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Trimmed from "full" (audit dependency review) to the features actually used:
# rt-multi-thread/macros (runtime + tokio::spawn + #[tokio::test]), sync
# (oneshot/watch/Semaphore), time (timeout/interval/sleep), io-util
# (AsyncBufReadExt/AsyncWriteExt/BufReader), process (child processes),
# signal (SIGTERM/SIGINT handling), net (UnixListener for the cpu fork server).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Cross-crate inlining across the hot path (envelope parse -> conversion ->
# broker write), which is spread over several modules and dependencies.
# Deliberately NOT panic = "abort": the dispatch path relies on unwinding, both
# for DecrGuard's panic-safe inflight accounting and so a panic in one task
# cannot take down the worker.
lto = "fat"
codegen-units = 1

[dev-dependencies]
libc = "0.2"
# connection-manager: worker/tests/redis_response_timeout.rs exercises
# ConnectionManager/ConnectionManagerConfig directly, the same types
# main.rs builds its two redis connections with.
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
