[package]
name = "cauli-worker"
version = "0.1.0"
edition = "2021"
description = "Rust worker runtime for cauli Python task queues"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bilalwork31-cyber/Cauli"
homepage = "https://github.com/bilalwork31-cyber/Cauli"
keywords = ["task-queue", "background-jobs", "redis", "worker", "celery"]
categories = ["asynchronous", "concurrency"]

[features]
default = ["dev-bin"]
# Enables the CAULI_EXEC_CMD hook in src/cpu.rs. The e2e suite needs it; a
# release build must not have it.
test-hooks = []
# Which name the binary is built under; identical code either way. The wheel's
# `cauli-worker` console script execs `cauli-worker-bin`, so the two names must
# differ. maturin ships every bin it built and cannot select one, so
# required-features selects: maturin runs with `--no-default-features -F wheel-bin`.
dev-bin = []
wheel-bin = []

# The runtime, shared by both bins below. Two bins naming one source file make
# cargo warn on every command. Nothing outside this crate uses the library.
[lib]
name = "cauli_worker"
path = "src/lib.rs"

[[bin]]
name = "cauli-worker"
path = "src/main.rs"
required-features = ["dev-bin"]

[[bin]]
name = "cauli-worker-bin"
path = "src/wheel_main.rs"
required-features = ["wheel-bin"]

[dependencies]
anyhow = "1"
async-channel = "2"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
gethostname = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
pyo3 = { version = "0.30", features = ["auto-initialize"] }
rand = "0.10"
ring = "0.17"
# tokio-rustls-comp: without a TLS feature, rediss:// URLs fail to parse and
# every TLS only managed Redis is unreachable. rustls avoids an OpenSSL build
# dependency. It trusts the platform certificate store; webpki-roots would
# replace that with a baked in bundle and break private CAs.
redis = { version = "1.8", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
# redis pulls rustls with no crypto provider, so the first rediss:// connection
# would panic. `ring` needs only cc (aws-lc-rs needs cmake and nasm). The
# runtime installs it explicitly rather than leaving it to feature unification.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
# arbitrary_precision: unknown envelope fields re-enqueued on retry keep exact
# integers outside i64/u64 instead of rounding through f64.
# preserve_order: the same passthrough keeps nested key order.
# raw_value: args, kwargs and results cross the worker as opaque JSON text.
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Not panic = "abort": DecrGuard's inflight accounting and per task panic
# isolation rely on unwinding.
lto = "fat"
codegen-units = 1

[dev-dependencies]
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
# connection-manager: tests/redis_response_timeout.rs uses ConnectionManager.
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
