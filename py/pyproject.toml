[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauli"
version = "0.1.0"
description = "Python client for cauli, a Rust background worker runtime for Python task queues"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "the cauli contributors" },
]
keywords = ["task-queue", "background-jobs", "redis", "worker", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "redis>=5",
]
[project.urls]
Homepage = "https://github.com/bilalwork31-cyber/Cauli"
Repository = "https://github.com/bilalwork31-cyber/Cauli"
Issues = "https://github.com/bilalwork31-cyber/Cauli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Optional JSON codec acceleration (cauli._codec); the wire format is
# unchanged, and everything works without it. Disable at runtime with
# CAULI_DISABLE_MSGSPEC=1.
speed = [
    "msgspec>=0.18",
]

[tool.setuptools]
packages = ["cauli"]

[tool.setuptools.package-data]
cauli = ["py.typed"]
