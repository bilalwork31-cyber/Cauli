[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauli"
version = "0.1.0"
description = "Python client for cauli, a Rust background worker runtime for Python task queues"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "the cauli contributors" },
]
keywords = ["task-queue", "background-jobs", "redis", "worker", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "redis>=5.0.1",
    # Required: there is no stdlib json fallback (see py/cauli/_codec.py).
    "msgspec>=0.18",
    # Unconditional: Windows, Alpine and distroless have no system tz database,
    # and a CrontabSchedule with an unresolvable zone raises at import.
    "tzdata",
    # The marker matches exactly the published worker wheels (Linux x86_64 and
    # aarch64, CPython 3.10 to 3.14); elsewhere it drops the requirement and the
    # client installs enqueue only. Raise python_version with the release
    # matrix. musl and 3.13t look supported to PEP 508 but have no wheel, so pip
    # fails there: use the enqueue only recipe (PROTOCOL.md section 13.4).
    "cauli-worker==0.1.0; sys_platform == 'linux' and platform_python_implementation == 'CPython' and (platform_machine == 'x86_64' or platform_machine == 'aarch64') and python_version < '3.15'",
]

[project.scripts]
# PROTOCOL.md section 10.7 says why beat is not a worker flag.
cauli-beat = "cauli.beat:main"

[project.urls]
Homepage = "https://github.com/bilalwork31-cyber/Cauli"
Repository = "https://github.com/bilalwork31-cyber/Cauli"
Issues = "https://github.com/bilalwork31-cyber/Cauli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Same pin as .github/workflows/ci.yml. Newer ruff enables more rules by default.
    "ruff==0.15.22",
]
django = [
    "django>=4.2",
]
# Empty: msgspec is required now; kept so `cauli[speed]` still installs.
speed = []

[tool.setuptools]
packages = ["cauli", "cauli.contrib"]
# Byte identical copies of the root licenses: setuptools cannot glob outside
# py/, and Apache-2.0 section 4(a) requires shipping the license.
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]

[tool.setuptools.package-data]
cauli = ["py.typed"]
