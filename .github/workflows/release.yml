name: release

# Builds and publishes both halves of a cauli release:
#
#   cauli          pure-Python client, one py3-none-any wheel + an sdist
#   cauli-worker   the Rust worker, one wheel per (CPython minor, arch)
#
# The worker embeds CPython (NEEDED libpython3.X.so), hence a wheel per minor,
# installed into the user's venv. Nothing uploads until a wheel has passed the
# integration suite from a clean venv (`verify`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (off = build and verify only)"
        type: boolean
        default: false

permissions:
  contents: read

# glibc floor 2.35 (Ubuntu 22.04, Debian 12, RHEL 9, python:3.x-slim), set by
# the runner, not manylinux: manylinux_2_28 CPython has no shared libpython and
# pyo3 auto-initialize refuses static embedding. A lower floor needs a build
# environment with both an old glibc and a shared CPython for every version.

# The CPython list is repeated in the `worker`, `verify` and `verify-bare`
# matrices: `env` is not available in `jobs.<id>.strategy`. Adding a version
# means all three, the classifiers and the `cauli-worker` pin in py/pyproject.toml.

jobs:
  version:
    name: versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: cauli, cauli-worker and the tag all say the same thing
        run: |
          python scripts/check_versions.py \
            "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

  client:
    name: cauli (sdist + wheel)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist --wheel --outdir dist py
      - uses: actions/upload-artifact@v7
        with:
          name: dist-client
          path: dist/*

  worker:
    name: cauli-worker (${{ matrix.target }}, cp${{ matrix.python }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        include:
          - target: x86_64
            runner: ubuntu-22.04
          - target: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      # setup-python's CPython is built with --enable-shared, which the readelf
      # assertion below depends on.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Native per arch: a cross image would bring back a static CPython.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: worker
          target: ${{ matrix.target }}
          # Built on the runner, where CPython is shared; manylinux auto still tags
          # manylinux_2_35_*, which PyPI accepts and bare linux_* it refuses.
          container: off
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter python${{ matrix.python }}
            --no-default-features --features wheel-bin

      # A statically linked worker carries its own interpreter with the build's
      # sys.prefix: on a user's machine it dies looking for a stdlib or cannot
      # import their tasks. Fail the build instead.
      - name: assert the worker links libpython dynamically
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(worker/dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "expected exactly one wheel, got: ${wheels[*]:-none}" >&2
            exit 1
          fi
          rm -rf _probe && mkdir _probe
          unzip -q -o "${wheels[0]}" -d _probe
          binary=$(ls _probe/*.data/scripts/cauli-worker-bin)
          echo "== dynamic section of $binary =="
          readelf -d "$binary" | tee _probe/dyn.txt
          if ! grep -q "libpython${{ matrix.python }}" _probe/dyn.txt; then
            echo >&2
            echo "FAIL: no NEEDED entry for libpython${{ matrix.python }}." >&2
            echo "The worker embeds CPython and must link it dynamically, so" >&2
            echo "it runs the user's interpreter rather than a copy of the" >&2
            echo "build container's. Build against a CPython configured with" >&2
            echo "--enable-shared." >&2
            exit 1
          fi
          echo "ok: dynamically linked against libpython${{ matrix.python }}"

          # The console script repairs the libpython search path, then execs the
          # binary. pip copies the wheel's mode and git here records no exec bit, so
          # assert it.
          scripts=(_probe/*.data/scripts/cauli-worker)
          if [ ${#scripts[@]} -ne 1 ] || [ ! -x "${scripts[0]}" ]; then
            echo >&2
            echo "FAIL: the cauli-worker console script is missing or is not" >&2
            echo "executable in the wheel. pip copies the mode straight out" >&2
            echo "of the wheel, so a mode 644 script installs unrunnable." >&2
            echo "Fix with: git update-index --chmod=+x" >&2
            echo "  worker/wheel-data/scripts/cauli-worker" >&2
            exit 1
          fi
          head -1 "${scripts[0]}" | grep -qx '#!python'
          echo "ok: cauli-worker console script present and executable"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-worker-${{ matrix.target }}-cp${{ matrix.python }}
          path: worker/dist/*.whl

  verify:
    name: verify wheel (x86_64, cp${{ matrix.python }})
    needs: [worker, client]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      # Two downloads, not a brace pattern: only this CPython's wheel may be
      # present, or pip resolves another and proves nothing.
      - uses: actions/download-artifact@v8
        with:
          name: dist-client
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: dist-worker-x86_64-cp${{ matrix.python }}
          path: artifacts

      # A user's venv: only what pip resolved from the artifacts, no source tree.
      - name: install the built wheels into a clean venv
        run: |
          set -euo pipefail
          ls -l artifacts
          python -m venv .relvenv
          .relvenv/bin/pip install --upgrade pip
          # By path: cauli and cauli-worker are the files to be published, while
          # third party deps resolve from the index as a user's pip does.
          .relvenv/bin/pip install artifacts/cauli-*.whl \
            artifacts/cauli_worker-*.whl
          .relvenv/bin/pip install pytest
          test -x .relvenv/bin/cauli-worker
          test -x .relvenv/bin/cauli-beat
          # Asked of the installed artifacts: both halves must be the same release.
          worker_v=$(.relvenv/bin/cauli-worker --version | awk '{print $2}')
          client_v=$(.relvenv/bin/python -c "import cauli; print(cauli.__version__)")
          echo "worker $worker_v / client $client_v"
          test "$worker_v" = "$client_v"

      # `pip install cauli` alone must yield a runnable worker; every other step
      # installs the wheels by path, so only this one checks the metadata.
      - name: plain `pip install cauli` lands a working worker
        run: |
          set -euo pipefail
          python -m venv .onecmd
          .onecmd/bin/pip install --upgrade pip
          # Third party deps from the index first, so the --no-index resolve can only
          # pick the artifacts about to be published.
          .onecmd/bin/pip install "redis>=5.0.1" "msgspec>=0.18" tzdata
          .onecmd/bin/pip install --no-index --find-links artifacts cauli
          .onecmd/bin/pip show cauli-worker >/dev/null
          test -x .onecmd/bin/cauli-worker
          # --print-plan needs no Redis and no app: proof the binary starts.
          .onecmd/bin/cauli-worker --print-plan

      # The published artifact runs the real cross-component suite: a real
      # worker binary, real cpu child processes, real Redis.
      - name: itest against the installed binary
        working-directory: itest
        env:
          CAULI_WORKER_BIN: ${{ github.workspace }}/.relvenv/bin/cauli-worker
          CAULI_VENV: ${{ github.workspace }}/.relvenv
        run: ../.relvenv/bin/pytest -q test_integration.py

  verify-bare:
    name: verify wheel with no help from the environment (cp${{ matrix.python }})
    needs: [worker, client]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      # No actions/setup-python: its LD_LIBRARY_PATH hides that the binary has no
      # RUNPATH. Without a libpython the loader finds, it dies before main, even
      # on `cauli-worker --version`.
      - uses: actions/download-artifact@v8
        with:
          name: dist-client
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: dist-worker-x86_64-cp${{ matrix.python }}
          path: artifacts

      # docker run, not `container:`, so no runner environment leaks in. uv's
      # CPython keeps libpython where no ldconfig looks, like conda and pyenv.
      - name: install and RUN the wheel on a bare ubuntu 24.04 with uv
        run: |
          set -euo pipefail
          cat > bare.sh <<'SH'
          set -eu
          # If this inherits a libpython search path the leg proves nothing.
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            echo "FAIL: LD_LIBRARY_PATH is set ($LD_LIBRARY_PATH)." >&2
            echo "This job must run with no libpython on the search path." >&2
            exit 1
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python "$PYVER" /venv
          uv pip install --python /venv/bin/python /artifacts/cauli-*.whl \
            /artifacts/cauli_worker-*.whl
          test -x /venv/bin/cauli-worker
          test -x /venv/bin/cauli-worker-bin
          test -x /venv/bin/cauli-beat

          # The failure is at exec time: run it through the console script, as a user does.
          /venv/bin/cauli-worker --version
          /venv/bin/cauli-worker --help >/dev/null

          # The raw binary must really fail, so a no op wrapper cannot pass.
          if /venv/bin/cauli-worker-bin --version >/dev/null 2>&1; then
            echo "note: the raw binary starts unaided in this image" >&2
          else
            echo "confirmed: the raw binary alone still cannot start here" >&2
          fi

          worker_v=$(/venv/bin/cauli-worker --version | awk '{print $2}')
          client_v=$(/venv/bin/python -c "import cauli; print(cauli.__version__)")
          echo "worker $worker_v / client $client_v"
          test "$worker_v" = "$client_v"
          SH
          docker run --rm \
            -e PYVER=${{ matrix.python }} \
            -v "$PWD/artifacts:/artifacts:ro" \
            -v "$PWD/bare.sh:/bare.sh:ro" \
            ubuntu:24.04 bash /bare.sh

  github-release:
    name: attach raw binaries to the release
    needs: [verify, verify-bare]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-worker-*
          path: wheels
          merge-multiple: true

      # For deployments outside a virtualenv. The file name carries the CPython
      # version the binary is bound to.
      - name: unpack each wheel into a named tarball
        run: |
          set -euo pipefail
          mkdir -p release
          for whl in wheels/*.whl; do
            base=$(basename "$whl" .whl)
            tags=${base#cauli_worker-}            # <version>-cp3XX-cp3XX-<plat>
            rm -rf _u && mkdir _u
            unzip -q "$whl" -d _u
            install -m755 _u/*.data/scripts/cauli-worker-bin release/cauli-worker
            tar -C release -czf "release/cauli-worker-${tags}.tar.gz" cauli-worker
            rm release/cauli-worker
          done
          ls -l release

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.tar.gz
            wheels/*.whl
          body: |
            `cauli-worker` embeds CPython, so each binary is bound to one
            CPython minor version. Pick the tarball matching your interpreter,
            or just `pip install cauli-worker` and let pip choose.

  publish:
    name: publish to PyPI
    needs: [verify, verify-bare]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing (OIDC). No API token stored in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
