name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  worker:
    name: worker (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: cargo fmt --check
        working-directory: worker
        run: cargo fmt --check
      - name: cargo clippy (default features)
        working-directory: worker
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy (test-hooks feature)
        working-directory: worker
        run: cargo clippy --all-targets --features test-hooks -- -D warnings
      - name: cargo test --release --features test-hooks
        working-directory: worker
        run: cargo test --release --features test-hooks
      - name: cargo audit
        # Advisory-db fetch is occasionally flaky in CI; don't fail the
        # whole build over a transient network issue on an advisory-only
        # check. A real hit still shows up loudly in the job log.
        continue-on-error: true
        working-directory: worker
        run: |
          cargo install cargo-audit --locked
          cargo audit

  py:
    name: py (client, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install cauli (editable, dev extras) and ruff
        run: |
          # cauli requires cauli-worker, the prebuilt binary wheel that this
          # repository BUILDS rather than downloads, and that only exists on
          # the index once a release has been cut. Resolving it here would
          # make this job's result depend on the state of PyPI instead of on
          # the code under test, so the third party dependencies are installed
          # first and the client goes in with --no-deps. The packaging job is
          # where that pin is proved, against the wheels it just built.
          pip install "redis>=5" "msgspec>=0.18" tzdata "pytest>=8"
          pip install -e py --no-deps
          pip install ruff==0.15.22
      - name: ruff check
        run: |
          ruff check py/ worker/src/shim.py itest/ scripts/ \
            worker/wheel-data/scripts/cauli-worker
      - name: ruff format --check
        run: |
          ruff format --check py/ worker/src/shim.py itest/ scripts/ \
            worker/wheel-data/scripts/cauli-worker
      - name: pytest
        working-directory: py
        run: pytest -q

  itest:
    name: itest (cross-component)
    runs-on: ubuntu-latest
    needs: [worker, py]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Build release worker
        working-directory: worker
        run: cargo build --release --bin cauli-worker
      - name: Install cauli (editable) and pytest
        # --no-deps for the same reason as the py job: cauli-worker is built
        # here, not fetched, and this job runs against the binary cargo just
        # produced.
        run: |
          pip install "redis>=5" "msgspec>=0.18" tzdata pytest
          pip install -e py --no-deps
      - name: Run itest
        working-directory: itest
        env:
          CAULI_WORKER_BIN: ${{ github.workspace }}/worker/target/release/cauli-worker
          CAULI_VENV: ${{ env.pythonLocation }}
        run: pytest -q

  package:
    name: packaging (release artifacts still build and run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Versions agree across cauli and cauli-worker
        run: python scripts/check_versions.py

      - name: Packaged license copies match the repository originals
        run: python scripts/check_licenses.py

      - name: Build the client sdist and wheel
        run: |
          pip install build
          python -m build --sdist --wheel --outdir dist py

      # One config only. The release workflow builds the full
      # (CPython minor x arch) matrix; this exists so packaging breakage shows
      # up on the PR that caused it rather than at tag time.
      # manylinux is OFF here, deliberately, and this job is weaker than the
      # release build because of it. The manylinux_2_28 image ships a CPython
      # with no shared libpython, and pyo3's auto-initialize feature refuses
      # to build against a static only interpreter, which is the same hazard
      # the release workflow warns about right before its readelf assertion.
      # The runner's own CPython is built with --enable-shared, so building
      # on the host proves the code compiles, the wheel assembles and the
      # binary links libpython dynamically. What it no longer proves is the
      # glibc floor: this wheel carries the runner's glibc, not 2.28. Cutting
      # a real release still needs a build environment that has both an old
      # glibc and a shared CPython.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: worker
          target: x86_64
          container: off
          manylinux: auto
          args: >-
            --release --out ../dist --interpreter python3.12
            --no-default-features --features wheel-bin

      # Same invariant the release workflow gates on: the worker embeds
      # CPython and must link it dynamically, or it runs its own interpreter
      # instead of the user's and cannot see their tasks.
      - name: Worker links libpython dynamically
        run: |
          set -euo pipefail
          rm -rf _probe && mkdir _probe
          unzip -q -o dist/cauli_worker-*.whl -d _probe
          readelf -d _probe/*.data/scripts/cauli-worker-bin | tee _probe/dyn.txt
          grep -q "libpython3.12" _probe/dyn.txt \
            || { echo "FAIL: worker did not link libpython dynamically" >&2; exit 1; }
          # pip copies the mode straight out of the wheel, so a console script
          # committed without its exec bit installs unrunnable.
          test -x _probe/*.data/scripts/cauli-worker \
            || { echo "FAIL: cauli-worker console script is not executable" >&2; exit 1; }

      # The one check the rest of CI structurally cannot make: every other
      # job here runs under actions/setup-python, which exports
      # LD_LIBRARY_PATH and so hides the fact that the worker binary carries
      # no RUNPATH. In a bare container with a uv managed CPython, nothing
      # points the loader at libpython, and the binary dies before main unless
      # the cauli-worker console script fixes the search path first.
      - name: Run the wheel where nothing has put libpython on the search path
        run: |
          set -euo pipefail
          cat > bare.sh <<'SH'
          set -eu
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            echo "FAIL: LD_LIBRARY_PATH is set, this check proves nothing" >&2
            exit 1
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.12 /venv
          uv pip install --python /venv/bin/python /dist/cauli-*.whl \
            /dist/cauli_worker-*.whl
          test -x /venv/bin/cauli-worker
          test -x /venv/bin/cauli-worker-bin
          /venv/bin/cauli-worker --version
          /venv/bin/cauli-worker --help >/dev/null
          SH
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/bare.sh:/bare.sh:ro" \
            ubuntu:24.04 bash /bare.sh

      # `pip install cauli` on its own has to leave the user with a worker
      # binary. Every other step here installs the two wheels by path, so this
      # is the only one that reads the client's dependency metadata at all.
      - name: Plain `pip install cauli` lands a working worker
        run: |
          set -euo pipefail
          python -m venv .onecmd
          .onecmd/bin/pip install --upgrade pip
          # Third party dependencies from the index first, so the resolve below
          # can be --no-index and cauli/cauli-worker can only be the wheels
          # just built rather than an older pair already on PyPI.
          .onecmd/bin/pip install "redis>=5" "msgspec>=0.18" tzdata
          .onecmd/bin/pip install --no-index --find-links dist cauli
          .onecmd/bin/pip show cauli-worker >/dev/null
          test -x .onecmd/bin/cauli-worker
          # --print-plan needs no Redis and no app: the cheapest proof that
          # what pip installed actually starts.
          .onecmd/bin/cauli-worker --print-plan

      - name: Install the wheels into a clean venv and run itest
        run: |
          set -euo pipefail
          python -m venv .relvenv
          .relvenv/bin/pip install --upgrade pip
          # Named by path, not by requirement: cauli and cauli-worker can then only
          # be the files we are about to publish, while their third party
          # dependencies resolve from the index exactly as a user's pip fetches
          # them. --no-index cannot do this job; cauli needs redis and msgspec,
          # and neither is in the artifact directory.
          .relvenv/bin/pip install dist/cauli-*.whl dist/cauli_worker-*.whl
          .relvenv/bin/pip install pytest
          worker_v=$(.relvenv/bin/cauli-worker --version | awk '{print $2}')
          client_v=$(.relvenv/bin/python -c "import cauli; print(cauli.__version__)")
          test "$worker_v" = "$client_v"
          cd itest
          CAULI_WORKER_BIN="$GITHUB_WORKSPACE/.relvenv/bin/cauli-worker" \
          CAULI_VENV="$GITHUB_WORKSPACE/.relvenv" \
            ../.relvenv/bin/pytest -q test_integration.py
