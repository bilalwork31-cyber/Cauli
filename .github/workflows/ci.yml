name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  worker:
    name: worker (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      # The interpreter the worker embeds. The shim needs msgspec; cauli itself
      # must be absent (pyrt.rs asserts it, the fixture app is duck typed).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install msgspec into the embedded interpreter
        run: python -m pip install "msgspec>=0.18"
      - name: cargo fmt --check
        working-directory: worker
        run: cargo fmt --check
      - name: cargo clippy (default features)
        working-directory: worker
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy (test-hooks feature)
        working-directory: worker
        run: cargo clippy --all-targets --features test-hooks -- -D warnings
      - name: cargo test --release --features test-hooks
        working-directory: worker
        run: cargo test --release --features test-hooks
      - name: cargo audit
        # The advisory db fetch is flaky; a real hit still shows in the log.
        continue-on-error: true
        working-directory: worker
        run: |
          cargo install cargo-audit --locked
          cargo audit

  py:
    name: py (client, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install cauli (editable, dev extras) and ruff
        run: |
          # cauli requires cauli-worker, which this repo builds and PyPI only has after
          # a release, so third party deps go first and cauli goes in with --no-deps.
          # The packaging job proves the pin against the wheels it builds.
          pip install "redis>=5.0.1" "msgspec>=0.18" tzdata "pytest>=8"
          pip install -e py --no-deps
          pip install ruff==0.15.22
      - name: ruff check
        run: |
          ruff check py/ worker/src/shim.py itest/ scripts/ \
            worker/wheel-data/scripts/cauli-worker
      - name: ruff format --check
        run: |
          ruff format --check py/ worker/src/shim.py itest/ scripts/ \
            worker/wheel-data/scripts/cauli-worker
      - name: pytest
        working-directory: py
        run: pytest -q

  itest:
    name: itest (cross-component, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [worker, py]
    strategy:
      fail-fast: false
      matrix:
        # 3.14t: the free threaded build, worker embedded with the GIL off.
        python-version: ["3.12", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Build release worker
        working-directory: worker
        env:
          PYO3_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: cargo build --release --bin cauli-worker
      - name: Install cauli (editable) and pytest
        # --no-deps: cauli-worker is the binary cargo just built, not PyPI's.
        run: |
          pip install "redis>=5.0.1" "msgspec>=0.18" tzdata pytest
          pip install -e py --no-deps
      - name: Run itest
        working-directory: itest
        env:
          CAULI_WORKER_BIN: ${{ github.workspace }}/worker/target/release/cauli-worker
          CAULI_VENV: ${{ env.pythonLocation }}
        run: pytest -q

  package:
    name: packaging (release artifacts still build and run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Versions agree across cauli and cauli-worker
        run: python scripts/check_versions.py

      - name: Packaged license copies match the repository originals
        run: python scripts/check_licenses.py

      - name: Build the client sdist and wheel
        run: |
          pip install build
          python -m build --sdist --wheel --outdir dist py

      # One config, so packaging breakage shows on the PR; release builds the full
      # matrix. No manylinux here: its CPython has no shared libpython, which pyo3
      # auto-initialize refuses. So this proves build, wheel assembly and dynamic
      # libpython linking, but not the glibc 2.28 floor.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: worker
          target: x86_64
          container: off
          manylinux: auto
          args: >-
            --release --out ../dist --interpreter python3.12
            --no-default-features --features wheel-bin

      # The worker must link CPython dynamically, or it runs its own interpreter
      # and cannot see the user's tasks.
      - name: Worker links libpython dynamically
        run: |
          set -euo pipefail
          rm -rf _probe && mkdir _probe
          unzip -q -o dist/cauli_worker-*.whl -d _probe
          readelf -d _probe/*.data/scripts/cauli-worker-bin | tee _probe/dyn.txt
          grep -q "libpython3.12" _probe/dyn.txt \
            || { echo "FAIL: worker did not link libpython dynamically" >&2; exit 1; }
          # pip copies the wheel's mode, so a script without its exec bit is unrunnable.
          test -x _probe/*.data/scripts/cauli-worker \
            || { echo "FAIL: cauli-worker console script is not executable" >&2; exit 1; }

      # setup-python exports LD_LIBRARY_PATH everywhere else, hiding that the binary
      # has no RUNPATH. In a bare container with uv's CPython it dies before main
      # unless the cauli-worker console script sets the search path.
      - name: Run the wheel where nothing has put libpython on the search path
        run: |
          set -euo pipefail
          cat > bare.sh <<'SH'
          set -eu
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            echo "FAIL: LD_LIBRARY_PATH is set, this check proves nothing" >&2
            exit 1
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.12 /venv
          uv pip install --python /venv/bin/python /dist/cauli-*.whl \
            /dist/cauli_worker-*.whl
          test -x /venv/bin/cauli-worker
          test -x /venv/bin/cauli-worker-bin
          /venv/bin/cauli-worker --version
          /venv/bin/cauli-worker --help >/dev/null
          SH
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/bare.sh:/bare.sh:ro" \
            ubuntu:24.04 bash /bare.sh

      # The only step that reads cauli's dependency metadata: `pip install cauli`
      # alone must yield a worker binary.
      - name: Plain `pip install cauli` lands a working worker
        run: |
          set -euo pipefail
          python -m venv .onecmd
          .onecmd/bin/pip install --upgrade pip
          # Third party deps from the index first, so the --no-index resolve can only
          # pick the wheels just built.
          .onecmd/bin/pip install "redis>=5.0.1" "msgspec>=0.18" tzdata
          .onecmd/bin/pip install --no-index --find-links dist cauli
          .onecmd/bin/pip show cauli-worker >/dev/null
          test -x .onecmd/bin/cauli-worker
          # --print-plan needs no Redis and no app: proof the install starts.
          .onecmd/bin/cauli-worker --print-plan

      - name: Install the wheels into a clean venv and run itest
        run: |
          set -euo pipefail
          python -m venv .relvenv
          .relvenv/bin/pip install --upgrade pip
          # By path: cauli and cauli-worker are the files to be published, while
          # third party deps resolve from the index as a user's pip does.
          .relvenv/bin/pip install dist/cauli-*.whl dist/cauli_worker-*.whl
          .relvenv/bin/pip install pytest
          worker_v=$(.relvenv/bin/cauli-worker --version | awk '{print $2}')
          client_v=$(.relvenv/bin/python -c "import cauli; print(cauli.__version__)")
          test "$worker_v" = "$client_v"
          cd itest
          CAULI_WORKER_BIN="$GITHUB_WORKSPACE/.relvenv/bin/cauli-worker" \
          CAULI_VENV="$GITHUB_WORKSPACE/.relvenv" \
            ../.relvenv/bin/pytest -q test_integration.py
